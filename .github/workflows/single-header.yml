name: Single-header

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Generate and compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate single header
        run: python scripts/amalgamate.py
      - name: Verify generated header is current
        run: git diff --exit-code -- single_include/unicomuse.h
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build library and single-header compile test
        run: cmake --build build --config Release
      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload single-header artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicomuse-single-header-${{ matrix.os }}
          path: single_include/unicomuse.h

  attach-release-asset:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate single header
        run: python scripts/amalgamate.py
      - name: Attach single header to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" single_include/unicomuse.h --clobber

  publish-main-prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate single header
        run: python scripts/amalgamate.py
      - name: Create or update commit pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: main-${{ github.sha }}
          RELEASE_TITLE: Main build ${{ github.sha }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" single_include/unicomuse.h --clobber
          else
            gh release create "$TAG_NAME" single_include/unicomuse.h \
              --title "$RELEASE_TITLE" \
              --notes "Automated pre-release from main commit ${GITHUB_SHA}." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
